name: Stage reviewed P4-P6 objects
on:
  push:
    branches: ['audit/p456-stage']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish exact reviewed objects only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          def run(*args, **kw):
              return subprocess.check_output(args, **kw).decode().strip()
          plan=json.loads(pathlib.Path('audit-p456.json').read_text())
          encoded=''.join(pathlib.Path(p).read_text() for p in plan['patchParts'])
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()==plan['patchSha256']
          subprocess.run(['git','checkout','--detach',plan['base']],check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          tree=run('git','write-tree')
          assert tree == plan['tree'], (tree,plan['tree'])
          def api(endpoint, data):
              return json.loads(subprocess.check_output(['gh','api','--method','POST','repos/'+os.environ['GH_REPO']+'/git/'+endpoint,'--input','-'],input=json.dumps(data).encode()))
          entries=[]
          for line in run('git','diff','--cached','--name-status').splitlines():
              status,name=line.split('\t')
              assert status in ('A','M','D')
              assert not name.startswith('.github/'), 'Workflow edits require the connector, not this transport'
              if status == 'D':
                  entries.append({'path':name,'mode':'100644','type':'blob','sha':None});continue
              content=pathlib.Path(name).read_bytes()
              blob=api('blobs',{'content':base64.b64encode(content).decode(),'encoding':'base64'})
              entries.append({'path':name,'mode':run('git','ls-files','--stage','--',name).split()[0],'type':'blob','sha':blob['sha']})
          result=api('trees',{'base_tree':run('git','rev-parse',plan['base']+'^{tree}'),'tree':entries})
          assert result['sha']==tree,result
          print(json.dumps({'verifiedTree':tree,'base':plan['base'],'files':len(entries)}))
          PY
