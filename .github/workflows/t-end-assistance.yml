name: T end review assistance
# Congelado (fidelidad F0): referencia del analizador, solo ejecución manual.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Replace stale PR work only. Every push/manual run retains its own evidence.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22.16.0', cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: npm ci
      - run: npx vitest run tests/t-end-area.test.ts tests/t-peak-evidence.test.ts
      - name: Source-scale and annotated morphology contracts
        run: |
          node --test tests/source-scale*.node.mjs
          npx vitest run tests/annotated-morphology.test.ts
      - run: python -m pip install wfdb==4.3.1
      - name: Reacquire only the two already observed cohorts
        run: |
          python scripts/prepare-ludb-expansion.py --output "$RUNNER_TEMP/original40" --crosscheck
          python scripts/prepare-ludb-delineation.py --output "$RUNNER_TEMP/calibration40" --crosscheck
      - name: Evaluate aid separately, preserving all automatic outputs and matching
        run: node scripts/evaluate-t-end-assistance.mjs --original "$RUNNER_TEMP/original40/fixtures" --calibration "$RUNNER_TEMP/calibration40/fixtures" --output "$RUNNER_TEMP/t-end-assistance"
      - name: Opposed-cycle confidence preserves all 80 source measurements
        run: node scripts/validate-opposed-cycle-reference.mjs --original "$RUNNER_TEMP/original40/fixtures" --calibration "$RUNNER_TEMP/calibration40/fixtures" --output "$RUNNER_TEMP/t-end-assistance/opposed-cycle-reference.json"
      - name: Audit original morphology without another source download
        run: node scripts/reference-annotated-morphology.mjs --original "$RUNNER_TEMP/original40/fixtures" --calibration "$RUNNER_TEMP/calibration40/fixtures" --output "$RUNNER_TEMP/t-end-assistance/original-morphology"
      - name: Archive exact source and reports without raw demographic headers
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/t-end-assistance"
          git archive HEAD | gzip > "$RUNNER_TEMP/t-end-assistance/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/t-end-assistance/commit.txt"
          for name in original40 calibration40; do
            test ! -d "$RUNNER_TEMP/$name" || { rm -rf "$RUNNER_TEMP/$name/raw"; cp -r "$RUNNER_TEMP/$name" "$RUNNER_TEMP/t-end-assistance/$name"; }
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: t-end-assistance-${{ github.sha }}
          path: ${{ runner.temp }}/t-end-assistance/
          retention-days: 30
