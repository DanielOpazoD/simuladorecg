# One-use, hash-checked application of the two reviewed UI integration lines.
# Removed before the feature PR is opened. Never targets main.
name: Materialize reviewed regional UI hook
on:
  push:
    branches: ['feat/regional-rbbb-activation']
    paths: ['.github/workflows/materialize-regional-ui.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply only the exact reviewed two-line patch
        run: |
          test "$GITHUB_REF" = refs/heads/feat/regional-rbbb-activation
          python3 - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          p = Path('src/main.ts')
          def blob(data):
              return check_output(['git', 'hash-object', '--stdin'], input=data).decode().strip()
          old = p.read_bytes()
          assert blob(old) == 'bfb9171cb3b4244e93a3ab63b1b62bafc4de46d2'
          text = old.decode()
          anchor = '  $("#amplitude-note").textContent = state.note;\n'
          assert text.count(anchor) == 1
          text = 'import { regionalActivationControls } from "./ui/regional-activation";\n' + text
          text = text.replace(anchor, anchor + '  $("#regional-activation-controls").innerHTML = regionalActivationControls(c);\n')
          new = text.encode()
          assert blob(new) == '9bfe665aa40ee0a821519bc90c7bbc5d63519295'
          p.write_bytes(new)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts
          git commit -m 'feat: connect regional controls to the existing case update flow'
          git push origin HEAD:refs/heads/feat/regional-rbbb-activation
