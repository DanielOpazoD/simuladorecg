name: Stage audited Git objects
on:
  push:
    branches: ['audit/p123-object-staging']
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'DanielOpazoD/simuladorecg'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply reviewed patch and publish only verified Git objects
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: DanielOpazoD/simuladorecg
        run: |
          cp audit-staging.patch "$RUNNER_TEMP/change.patch"
          cp audit-staging.json "$RUNNER_TEMP/plan.json"
          python - <<'PY'
          import base64, json, os, pathlib, subprocess
          def run(*a, **kw):
              return subprocess.check_output(a, **kw).decode().strip()
          plan=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'plan.json').read_text())
          subprocess.run(['git','checkout','--detach',plan['base']],check=True)
          subprocess.run(['git','apply','--index',os.environ['RUNNER_TEMP']+'/change.patch'],check=True)
          tree=run('git','write-tree')
          assert tree==plan['tree'], (tree,plan['tree'])
          def api(endpoint, data):
              return json.loads(subprocess.check_output(['gh','api','--method','POST','repos/'+os.environ['GH_REPO']+'/git/'+endpoint,'--input','-'],input=json.dumps(data).encode()))
          entries=[]
          for line in run('git','diff','--cached','--name-status').splitlines():
              status,name=line.split('\t')
              assert status in ('A','M','D'), status
              if status=='D':
                  entries.append({'path':name,'mode':'100644','type':'blob','sha':None}); continue
              content=pathlib.Path(name).read_bytes()
              blob=api('blobs',{'content':base64.b64encode(content).decode(),'encoding':'base64'})
              mode=run('git','ls-files','--stage','--',name).split()[0]
              entries.append({'path':name,'mode':mode,'type':'blob','sha':blob['sha']})
          result=api('trees',{'base_tree':run('git','rev-parse',plan['base']+'^{tree}'),'tree':entries})
          assert result['sha']==tree,result
          print(json.dumps({'verifiedTree':tree,'base':plan['base'],'files':len(entries)}))
          PY
