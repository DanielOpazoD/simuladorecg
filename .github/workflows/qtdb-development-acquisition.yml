name: QTDB preselected development acquisition
on:
  push:
    branches: ['audit/qtdb-boundary-development']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install wfdb==4.3.1
      - run: python .stage/collect-qtdb.py "$RUNNER_TEMP/qtdb-development"
      - name: Preserve selection, source identity and runtime, not demographic headers
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/qtdb-development"
          cp .stage/collect-qtdb.py "$RUNNER_TEMP/qtdb-development/collector.py"
          git rev-parse HEAD > "$RUNNER_TEMP/qtdb-development/commit.txt"
          python -m pip freeze > "$RUNNER_TEMP/qtdb-development/python-packages.txt"
          rm -rf "$RUNNER_TEMP/qtdb-development/raw"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qtdb-development-${{ github.sha }}
          path: ${{ runner.temp }}/qtdb-development/
          retention-days: 30
