name: Calibrated ECG noise stress
on:
  pull_request:
    paths: ['src/engine/**', 'src/presets/**', 'benchmarks/noise-stress/**', 'scripts/*noise*', 'scripts/lib/noise*', 'tests/*noise*', 'tests/support/morphology-metrics.ts', 'package*.json', 'scripts/nstdb-source-cache.py', 'tests/test_nstdb_source_cache.py', 'tests/nstdb-cache-workflow.test.mjs', '.github/workflows/noise-stress.yml']
  push:
    branches: ['main']
    paths: ['src/engine/**', 'src/presets/**', 'benchmarks/noise-stress/**', 'scripts/*noise*', 'scripts/lib/noise*', 'tests/*noise*', 'tests/support/morphology-metrics.ts', 'package*.json', 'scripts/nstdb-source-cache.py', 'tests/test_nstdb_source_cache.py', 'tests/nstdb-cache-workflow.test.mjs', '.github/workflows/noise-stress.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Replace stale PR work only. Every push/manual run retains its own evidence.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  noise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22.16.0', cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: npm ci
      - run: python -m pip install wfdb==4.3.1
      - name: Restore reviewed acquisition and acceptance baselines
        run: |
          git worktree add --detach "$RUNNER_TEMP/noise-acquisition" 784173f94bc103686efb321fc13f1b8f40913f76
          git worktree add --detach "$RUNNER_TEMP/noise-baseline" 9246093052b3171cca81fb77951fd8eb24523a7c
          git worktree add --detach "$RUNNER_TEMP/noise-transition-before" 3c10eacd5fa4382d232c368777bd9d5f3b7f3475
          git worktree add --detach "$RUNNER_TEMP/noise-st-release" 10e3f39764ca3bf83f2fc9b543d4960ee12c1080
      - name: Discriminative reader, calibration, morphology and abstention tests
        run: |
          (cd "$RUNNER_TEMP/noise-acquisition" && python -m unittest discover -s tests -p test_noise_stress.py -v)
          npx vitest run tests/noise-stress.test.ts
          node --test tests/noise-regression.node.mjs
      - name: Test source-cache integrity
        run: python -m unittest discover -s tests -p test_nstdb_source_cache.py -v
      - uses: actions/cache/restore@v6.1.0
        id: nstdb-cache
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/nstdb-source
          key: nstdb-1.0.0-raw-b76bd98c5111439fcfff2f410afd70d64e79f072049c45b5a9916a3044fdb84f-v1
      - name: Authenticate cache before staging raw input
        run: python scripts/nstdb-source-cache.py restore --cache "$RUNNER_TEMP/nstdb-source" --raw "$RUNNER_TEMP/noise-stress/raw"
      - name: Acquire exposed NSTDB windows with the frozen reader
        run: python "$RUNNER_TEMP/noise-acquisition/scripts/prepare-noise-stress.py" --output "$RUNNER_TEMP/noise-stress"
      - name: Authenticate acquired bytes before reuse
        run: python scripts/nstdb-source-cache.py save --cache "$RUNNER_TEMP/nstdb-source" --raw "$RUNNER_TEMP/noise-stress/raw"
      - uses: actions/cache/save@v6.1.0
        if: steps.nstdb-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/nstdb-source
          key: nstdb-1.0.0-raw-b76bd98c5111439fcfff2f410afd70d64e79f072049c45b5a9916a3044fdb84f-v1
      - name: Paired current-worker evaluation, same evaluator and noise bytes
        run: |
          mkdir -p "$RUNNER_TEMP/noise-stress/before" "$RUNNER_TEMP/noise-stress/after"
          node scripts/benchmark-noise-stress.mjs "$RUNNER_TEMP/noise-stress/before" --noise-dir "$RUNNER_TEMP/noise-stress" --source-root "$RUNNER_TEMP/noise-baseline" --analyzer worker
          node scripts/benchmark-noise-stress.mjs "$RUNNER_TEMP/noise-stress/after" --noise-dir "$RUNNER_TEMP/noise-stress" --analyzer worker
      - name: Retain pre-ST comparison and enforce explicit source-migration bounds
        run: |
          node scripts/benchmark-noise-stress.mjs "$RUNNER_TEMP/noise-stress/transition-before" --noise-dir "$RUNNER_TEMP/noise-stress" --source-root "$RUNNER_TEMP/noise-transition-before" --analyzer worker
          node scripts/benchmark-noise-stress.mjs "$RUNNER_TEMP/noise-stress/st-release" --noise-dir "$RUNNER_TEMP/noise-stress" --source-root "$RUNNER_TEMP/noise-st-release" --analyzer worker
          node scripts/check-secondary-st-transition.mjs "$RUNNER_TEMP/noise-stress/transition-before/noise-results.json" "$RUNNER_TEMP/noise-stress/st-release/noise-results.json" "$RUNNER_TEMP/noise-stress/secondary-st-transition.json"
      - name: Enforce unchanged morphology and the explicit terminal-quality transition
        run: node scripts/check-noise-regression.mjs "$RUNNER_TEMP/noise-stress/before/noise-results.json" "$RUNNER_TEMP/noise-stress/after/noise-results.json" "$RUNNER_TEMP/noise-stress/acceptance-results.json" --terminal-consensus
      - name: Preserve exact code, limits and runtime
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/noise-stress"
          git archive HEAD | gzip > "$RUNNER_TEMP/noise-stress/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/noise-stress/commit.txt"
          python -m pip freeze > "$RUNNER_TEMP/noise-stress/python-packages.txt"
          node -p 'JSON.stringify(process.versions,null,2)' > "$RUNNER_TEMP/noise-stress/node-runtime.json"
          rm -rf "$RUNNER_TEMP/noise-stress/raw"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: noise-stress-${{ github.sha }}
          path: ${{ runner.temp }}/noise-stress/
          retention-days: 30
