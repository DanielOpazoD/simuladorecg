name: Heart rate detection quality
on:
  pull_request:
    paths: ['src/engine/**', 'scripts/*hr-quality*', 'benchmarks/hr-quality/**', 'tests/heart-rate-quality.test.ts', 'tests/hr-quality-external.test.mjs', 'tests/browser-hr-quality.mjs', 'scripts/nstdb-source-cache.py', 'tests/test_nstdb_source_cache.py', 'tests/nstdb-cache-workflow.test.mjs', '.github/workflows/hr-quality.yml']
  push:
    branches: ['main']
    paths: ['src/engine/**', 'scripts/*hr-quality*', 'benchmarks/hr-quality/**', 'tests/heart-rate-quality.test.ts', 'tests/hr-quality-external.test.mjs', 'tests/browser-hr-quality.mjs', 'scripts/nstdb-source-cache.py', 'tests/test_nstdb_source_cache.py', 'tests/nstdb-cache-workflow.test.mjs', '.github/workflows/hr-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Replace stale PR work only. Every push/manual run retains its own evidence.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22.16.0', cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: npm ci
      - run: python -m pip install wfdb==4.3.1
      - name: Restore exact PR19 baseline without changing the evaluated source
        run: git worktree add --detach "$RUNNER_TEMP/hr-baseline" 784173f94bc103686efb321fc13f1b8f40913f76
      - name: Test source-cache integrity
        run: python -m unittest discover -s tests -p test_nstdb_source_cache.py -v
      - uses: actions/cache/restore@v6.1.0
        id: nstdb-cache
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/nstdb-source
          key: nstdb-1.0.0-raw-b76bd98c5111439fcfff2f410afd70d64e79f072049c45b5a9916a3044fdb84f-v1
      - name: Authenticate cache before staging raw input
        run: python scripts/nstdb-source-cache.py restore --cache "$RUNNER_TEMP/nstdb-source" --raw "$RUNNER_TEMP/hr-quality/known/raw"
      - name: Acquire exposed and preregistered temporal windows
        run: python scripts/prepare-hr-quality.py --baseline "$RUNNER_TEMP/hr-baseline" --output "$RUNNER_TEMP/hr-quality"
      - name: Authenticate acquired bytes before reuse
        run: python scripts/nstdb-source-cache.py save --cache "$RUNNER_TEMP/nstdb-source" --raw "$RUNNER_TEMP/hr-quality/known/raw"
      - uses: actions/cache/save@v6.1.0
        if: steps.nstdb-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/nstdb-source
          key: nstdb-1.0.0-raw-b76bd98c5111439fcfff2f410afd70d64e79f072049c45b5a9916a3044fdb84f-v1
      - name: Paired evaluation, never tune to the replication results
        run: |
          node scripts/compare-hr-quality.mjs "$RUNNER_TEMP/hr-baseline" "$RUNNER_TEMP/hr-quality/known" "$RUNNER_TEMP/hr-quality/known-results.json"
          node scripts/compare-hr-quality.mjs "$RUNNER_TEMP/hr-baseline" "$RUNNER_TEMP/hr-quality/replication" "$RUNNER_TEMP/hr-quality/replication-results.json"
      - name: Build and verify the pinned browser runtime
        run: |
          npm run build
          node scripts/verify-browser-runtime.mjs
      - name: Verify the actual worker and visible review reason in production
        env:
          ECG_TEST_URL: http://127.0.0.1:5173/
          ECG_EXPECT_COMMIT: ${{ github.sha }}
          ECG_EVIDENCE_DIR: ${{ runner.temp }}/hr-quality/browser
        run: |
          npx vite preview --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/hr-vite.log" 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for n in {1..40}; do curl --silent --fail "$ECG_TEST_URL" > /dev/null && break; sleep 1; done
          node scripts/verify-production.mjs
          node tests/browser-hr-quality.mjs
      - name: Preserve evaluated code, sources and runtime
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/hr-quality"
          git archive HEAD | gzip > "$RUNNER_TEMP/hr-quality/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/hr-quality/commit.txt"
          python -m pip freeze > "$RUNNER_TEMP/hr-quality/python-packages.txt"
          node -p 'JSON.stringify(process.versions,null,2)' > "$RUNNER_TEMP/hr-quality/node-runtime.json"
          rm -rf "$RUNNER_TEMP/hr-quality/known/raw" "$RUNNER_TEMP/hr-quality/replication/raw"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hr-quality-${{ github.sha }}
          path: ${{ runner.temp }}/hr-quality/
          retention-days: 30
