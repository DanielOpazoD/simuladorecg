name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias
        run: npx vitest run
      - name: Tipos y build de producción
        run: npm run build
      - name: Humo en navegador (todos los presets)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4173 >/dev/null
          node tests/smoke-browser.mjs http://127.0.0.1:4173
      - name: Metrología independiente de pantalla y PNG
        run: node scripts/check-pixel-metrology.mjs "$RUNNER_TEMP/ecg-pixel-metrology"
      - name: Conservar resultados de metrología, incluidos fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-metrology-results
          path: |
            ${{ runner.temp }}/ecg-pixel-metrology/results.json
            ${{ runner.temp }}/ecg-pixel-metrology/screen-*.png
            ${{ runner.temp }}/ecg-pixel-metrology/export-*.png
          if-no-files-found: ignore
