name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fidelity-characterization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Auditar exposición, unidades y aptitud de referencias
        run: node scripts/audit-fidelity-evidence.mjs --output "$RUNNER_TEMP/ecg-fidelity/evidence.json"
      - name: Caracterizar adaptación ventricular en muestras finales
        if: ${{ !cancelled() }}
        run: node scripts/audit-ventricular-timing.mjs --output "$RUNNER_TEMP/ecg-fidelity/temporal.json"
      - name: Caracterizar relaciones conjuntas QRS–ST–T
        if: ${{ !cancelled() }}
        run: node scripts/audit-joint-morphology.mjs --output "$RUNNER_TEMP/ecg-fidelity/joint"
      - name: Conservar caracterizaciones, incluidos resultados adversos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-characterization
          path: ${{ runner.temp }}/ecg-fidelity/**/*.json
          if-no-files-found: error
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias
        run: npx vitest run
      - name: Tipos y build de producción
        run: npm run build
      - name: Humo en navegador (todos los presets)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4173 >/dev/null
          node tests/smoke-browser.mjs http://127.0.0.1:4173
      - name: Distribución ST, muestras finales y navegación accesible
        run: node tests/browser-st-distribution.mjs "$RUNNER_TEMP/ecg-st-distribution"
      - name: Interfaz simplificada y comparación entre ejemplos
        run: node tests/browser-case-comparison.mjs "$RUNNER_TEMP/ecg-case-comparison"
      - name: Adquisición limpia seleccionada, persistencia y exportación
        run: node tests/browser-clean-acquisition.mjs "$RUNNER_TEMP/ecg-clean-acquisition"
      - name: Lectura interactiva, muestras intactas y exportación
        run: node tests/browser-reading-interactions.mjs "$RUNNER_TEMP/ecg-reading/interactions"
      - name: Aumento contrastado con píxeles y controles negativos
        run: node tests/browser-reading-pixels.mjs "$RUNNER_TEMP/ecg-reading/pixels"
      - name: Biblioteca de isquemia y diálogos compactos
        run: node tests/browser-compact-navigation.mjs "$RUNNER_TEMP/ecg-reading/compact-navigation"
      - name: Papel compacto, medidas reunidas y selector de vista
        run: node tests/browser-paper-first.mjs "$RUNNER_TEMP/ecg-reading/paper-first"
      - name: Lupa de dos latidos, intervalos y geometría adaptable
        run: node tests/browser-lead-lens.mjs "$RUNNER_TEMP/ecg-reading/lead-lens"
      - name: Calibres de la lupa con ratón, tacto y teclado
        run: node tests/browser-lead-lens-manual.mjs "$RUNNER_TEMP/ecg-reading/lead-lens-manual"
      - name: Conservar pruebas de lectura interactiva, incluidos fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-reading-results
          path: ${{ runner.temp }}/ecg-reading
          if-no-files-found: ignore
      - name: Conservar pruebas de adquisición limpia, incluidos fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-acquisition-results
          path: ${{ runner.temp }}/ecg-clean-acquisition
          if-no-files-found: ignore
      - name: Conservar pruebas de comparación, incluidos fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-comparison-results
          path: ${{ runner.temp }}/ecg-case-comparison
          if-no-files-found: ignore
      - name: Conservar pruebas de distribución ST, incluidos fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st-distribution-results
          path: ${{ runner.temp }}/ecg-st-distribution
          if-no-files-found: ignore
      - name: Metrología independiente de pantalla y PNG
        run: node scripts/check-pixel-metrology.mjs "$RUNNER_TEMP/ecg-pixel-metrology"
      - name: Aula ECG, anotaciones, comparación y eco ilustrativo
        run: node tests/browser-teaching-workspace.mjs "$RUNNER_TEMP/ecg-teaching"
      - name: Medir anotaciones del PNG desde sus píxeles
        run: node tests/browser-teaching-pixels.mjs "$RUNNER_TEMP/ecg-teaching/pixels"
      - name: Conservar pruebas del Aula, incluidos fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teaching-workspace-results
          path: ${{ runner.temp }}/ecg-teaching
          if-no-files-found: ignore
      - name: Conservar resultados de metrología, incluidos fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-metrology-results
          path: |
            ${{ runner.temp }}/ecg-pixel-metrology/results.json
            ${{ runner.temp }}/ecg-pixel-metrology/screen-*.png
            ${{ runner.temp }}/ecg-pixel-metrology/export-*.png
            ${{ runner.temp }}/ecg-pixel-metrology/continuity-*.png
          if-no-files-found: ignore
