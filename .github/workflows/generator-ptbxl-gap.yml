name: Generator morphology gap
on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: npm ci
      - run: npx vitest run tests/generator-ptbxl-gap.test.mjs tests/ptbxl-morphology.test.mjs
      - run: python -m pip install wfdb==4.3.1
      - name: Reproduce frozen PTB-XL+ development reference
        run: |
          python scripts/ptbxl-benchmark.py --output "$RUNNER_TEMP/ptbxl"
          node scripts/benchmark-ptbxl-samples.mjs "$RUNNER_TEMP/ptbxl"
      - name: Describe generator gaps without tuning
        run: node scripts/compare-generator-ptbxl.mjs "$RUNNER_TEMP/ptbxl" "$RUNNER_TEMP/gap"
      - name: Archive exact source and report
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gap"
          git archive HEAD | gzip > "$RUNNER_TEMP/gap/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/gap/commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generator-ptbxl-gap-${{ github.sha }}
          path: ${{ runner.temp }}/gap/
          retention-days: 30
