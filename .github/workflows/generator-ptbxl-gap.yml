name: Generator morphology gap
on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: npm ci
      - run: npx vitest run tests/generator-ptbxl-gap.test.mjs tests/ptbxl-morphology.test.mjs
      - name: Download PTB-XL+ artifact produced by this same PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in {1..30}; do
            run_id=$(gh run list --workflow ptbxl-morphology.yml --branch "${{ github.head_ref || github.ref_name }}" --event "${{ github.event_name }}" --json databaseId,headSha,conclusion --jq '.[] | select(.headSha=="${{ github.event.pull_request.head.sha || github.sha }}") | select(.conclusion=="success") | .databaseId' | head -1)
            test -n "$run_id" && break
            sleep 10
          done
          test -n "$run_id"
          mkdir -p "$RUNNER_TEMP/ptbxl-artifact"
          gh run download "$run_id" --dir "$RUNNER_TEMP/ptbxl-artifact"
          ref=$(find "$RUNNER_TEMP/ptbxl-artifact" -name median-morphology.json -print -quit)
          test -n "$ref"
          dirname "$ref" > "$RUNNER_TEMP/ptbxl-path"
      - name: Describe generator gaps without tuning
        run: node scripts/compare-generator-ptbxl.mjs "$(cat "$RUNNER_TEMP/ptbxl-path")" "$RUNNER_TEMP/gap"
      - name: Archive exact source and report
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gap"
          git archive HEAD | gzip > "$RUNNER_TEMP/gap/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/gap/commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generator-ptbxl-gap-${{ github.sha }}
          path: ${{ runner.temp }}/gap/
          retention-days: 30
