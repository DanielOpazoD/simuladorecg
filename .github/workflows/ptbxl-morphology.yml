name: PTB-XL+ morphology reference
on:
  pull_request:
    paths: ['src/engine/**', 'src/presets/**', 'benchmarks/ptbxl-plus/**', 'scripts/*ptbxl*', 'scripts/secondary-stt-reference.py', 'tests/test_secondary_stt_reference.py', 'scripts/lib/ptbxl-morphology.mjs', 'tests/*ptbxl*', '.github/workflows/ptbxl-morphology.yml', '.github/workflows/generator-ptbxl-gap.yml']
  push:
    branches: ['main']
    paths: ['src/engine/**', 'src/presets/**', 'benchmarks/ptbxl-plus/**', 'scripts/*ptbxl*', 'scripts/secondary-stt-reference.py', 'tests/test_secondary_stt_reference.py', 'scripts/lib/ptbxl-morphology.mjs', 'tests/*ptbxl*', '.github/workflows/ptbxl-morphology.yml', '.github/workflows/generator-ptbxl-gap.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Replace stale PR work only. Every push/manual run retains its own evidence.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22.16.0', cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: npm ci
      - run: python -m pip install wfdb==4.3.1
      - name: Restore actual frozen acquisition and keep its protocol unchanged
        run: |
          git worktree add "$RUNNER_TEMP/ptbxl-acquisition" b783fbae5819c3bb3313931d8f2fce43420a9d85
          git diff --exit-code b783fbae5819c3bb3313931d8f2fce43420a9d85 HEAD -- scripts/ptbxl-benchmark.py tests/test_ptbxl_reference.py benchmarks/ptbxl-plus
      - name: Independent selection, statistics and waveform contracts
        run: |
          (cd "$RUNNER_TEMP/ptbxl-acquisition" && python -m unittest discover -s tests -p test_ptbxl_reference.py -v)
          npx vitest run tests/ptbxl-morphology.test.mjs tests/generator-ptbxl-gap.test.mjs
      - name: Original calibrated waveform contracts
        run: python -m unittest discover -s tests -p test_ptbxl_original_reference.py -v
      - name: Secondary ST-T reference contracts
        run: python -m unittest discover -s tests -p test_secondary_stt_reference.py -v
      - name: Select patients before feature acquisition and verify sources
        run: python "$RUNNER_TEMP/ptbxl-acquisition/scripts/ptbxl-benchmark.py" --output "$RUNNER_TEMP/ptbxl-reference"
      - name: Verify original physical calibration without reinterpreting vendor medians
        run: python scripts/ptbxl-original-reference.py --reference "$RUNNER_TEMP/ptbxl-reference" --output "$RUNNER_TEMP/ptbxl-reference/original-waveforms"
      - name: Describe median beats and unchanged generated samples separately
        run: node scripts/benchmark-ptbxl-samples.mjs "$RUNNER_TEMP/ptbxl-reference"
      - name: Describe generator gaps using the exact reference from this job
        run: node scripts/compare-generator-ptbxl.mjs "$RUNNER_TEMP/ptbxl-reference" "$RUNNER_TEMP/ptbxl-reference"
      - name: Describe secondary ST-T with verified tabular units
        run: python scripts/secondary-stt-reference.py --reference "$RUNNER_TEMP/ptbxl-reference" --metadata "$RUNNER_TEMP/ptbxl-reference/raw/ptb-xl/ptbxl_database.csv" --output "$RUNNER_TEMP/ptbxl-reference/secondary-stt-reference.json"
      - name: Preserve structural diagnostics on failure, never clinical comments
        if: failure()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'ptbxl-reference'
          entries=[]
          for h in sorted((root/'raw'/'ptb-xl-plus'/'median_beats'/'12sl').rglob('*.hea')):
              rows=[l for l in h.read_text().splitlines() if l.strip() and not l.lstrip().startswith('#')]
              entries.append({'file':str(h.relative_to(root/'raw')), 'headerFields':rows, 'dataBytes':h.with_suffix('.dat').stat().st_size if h.with_suffix('.dat').exists() else None})
              if len(entries)==3:break
          root.mkdir(parents=True,exist_ok=True)
          (root/'format-diagnostics.json').write_text(json.dumps(entries,indent=2)+'\n')
          print(json.dumps(entries))
          PY
      - name: Archive reproducible reference, not demographics or full source tables
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ptbxl-reference"
          git archive HEAD | gzip > "$RUNNER_TEMP/ptbxl-reference/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/ptbxl-reference/commit.txt"
          python -m pip freeze > "$RUNNER_TEMP/ptbxl-reference/python-packages.txt"
          node -p 'JSON.stringify(process.versions,null,2)' > "$RUNNER_TEMP/ptbxl-reference/node-runtime.json"
          rm -rf "$RUNNER_TEMP/ptbxl-reference/raw"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ptbxl-reference-${{ github.sha }}
          path: ${{ runner.temp }}/ptbxl-reference/
          retention-days: 30
