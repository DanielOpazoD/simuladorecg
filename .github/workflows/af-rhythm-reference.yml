name: AF timing reference
# Congelado (fidelidad F0): referencia del analizador, solo ejecución manual.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Replace stale PR work only. Every push/manual run retains its own evidence.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  af-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22.16.0', cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: npm ci
      - run: python -m pip install wfdb==4.3.1
      - run: python -m unittest discover -s tests -p test_af_rhythm_reference.py -v
      - name: Acquire every corrected-annotation record and verify release hashes
        run: python scripts/af-rhythm-reference.py "$RUNNER_TEMP/af-reference"
      - name: Compare timing without fitting or promoting a clinical threshold
        run: node scripts/compare-af-rhythm.mjs "$RUNNER_TEMP/af-reference/af-rhythm-reference.json" "$RUNNER_TEMP/af-reference/comparison.json"
      - name: Record exact source and runtime
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/af-reference"
          git rev-parse HEAD > "$RUNNER_TEMP/af-reference/commit.txt"
          python -m pip freeze > "$RUNNER_TEMP/af-reference/runtime.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: af-timing-${{ github.sha }}
          path: |
            ${{ runner.temp }}/af-reference/af-rhythm-reference.json
            ${{ runner.temp }}/af-reference/comparison.json
            ${{ runner.temp }}/af-reference/commit.txt
            ${{ runner.temp }}/af-reference/runtime.txt
          retention-days: 30

  ltaf-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        role: [development, evaluation]
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22.16.0', cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: npm ci
      - run: python -m pip install wfdb==4.3.1
      - name: Verify window boundaries, confounders and malformed annotations
        run: python -m unittest discover -s tests -p test_af_ltaf_reference.py -v
      - name: Acquire the fixed now-exposed cohort with release checksums
        run: python scripts/af-ltaf-reference.py --output "$RUNNER_TEMP/ltaf" --role "${{ matrix.role }}"
      - name: Repeat frozen comparison without refitting or hiding tail regressions
        run: node scripts/compare-af-renewal.mjs "$RUNNER_TEMP/ltaf/${{ matrix.role }}-reference.json" "$RUNNER_TEMP/ltaf/${{ matrix.role }}-comparison.json"
      - name: Record source, runtime and data attribution
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ltaf"
          git rev-parse HEAD > "$RUNNER_TEMP/ltaf/commit.txt"
          python -m pip freeze > "$RUNNER_TEMP/ltaf/runtime.txt"
          printf '%s\n' 'PhysioNet Long-Term AF Database 1.0.0: https://physionet.org/content/ltafdb/1.0.0/' 'Manually reviewed atr annotations; acknowledge MEDICALgorithmics contributors and follow dataset citation/license instructions.' 'Both fixed cohorts are now exposed. No new holdout or clinical validation is claimed.' > "$RUNNER_TEMP/ltaf/SOURCE.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ltaf-${{ matrix.role }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ltaf/*.json
            ${{ runner.temp }}/ltaf/*.txt
          if-no-files-found: error
          retention-days: 30
